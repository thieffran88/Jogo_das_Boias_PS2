name: Build PS2

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao do release (ex.: v1.0.0). Vazio = so compila."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev:latest
    steps:
      - name: Dependencias
        run: apk add --no-cache build-base make xorriso git

      - uses: actions/checkout@v4

      - name: Testes das regras
        run: make test

      - name: Compilar ELF e ISO
        run: |
          make
          make iso

      - uses: actions/upload-artifact@v4
        with:
          name: jogo-das-boias-ps2
          path: |
            jogo_das_boias.elf
            jogo_das_boias.iso

  # Ao enviar uma tag vX.Y.Z (ou rodar manualmente com "version"),
  # publica o ELF e a ISO em um release.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jogo-das-boias-ps2

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Jogo das Boias PS2 ${{ inputs.version || github.ref_name }}
          body: |
            Jogo das Boias PS2 - homebrew para PlayStation 2.

            - `jogo_das_boias.elf`: abra no PCSX2 (Iniciar ELF) ou no PS2 pelo uLaunchELF.
            - `jogo_das_boias.iso`: imagem de CD para PCSX2 ou OPL.

            Idiomas: Português, English, Español.
          files: |
            jogo_das_boias.elf
            jogo_das_boias.iso
